[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
bzip2-rs = "=0.1.2"
http = "=1.5.0"
js-sys = "=0.3.107"
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }

byte-io = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
failure-text = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
fastboot = { path = "crates/fastboot" }
fs-read = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
image-archive = { git = "https://git.halogenos.org/halogenOS/android_external_xos", rev = "c4fc5eadc4a920ccd5e2a37bd702fdfa4bcd7006" }
image-build = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
ota-package = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
release = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
sha256 = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
sparse-image = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
stock-package = { path = "crates/stock-package" }
transfer-retry = { path = "crates/transfer-retry" }
update-metadata = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }
wasm = { path = "crates/wasm" }
zip-records = { git = "https://git.halogenos.org/halogenOS/android_build_dist-package", rev = "b1dab044a27cb0383619f802df11a1433bc792fb" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
let_underscore_must_use = "deny"
allow_attributes = "deny"
format_push_string = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_results = "deny"
